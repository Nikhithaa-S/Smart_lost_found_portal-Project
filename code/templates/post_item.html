
{% extends "base.html" %}

{% block title %}Report Lost or Found Item{% endblock %}

{% block content %}

<div class="auth-card wide-card">

    <h2 class="text-center mb-4">
        Report Lost / Found Item
    </h2>

    <form method="POST" enctype="multipart/form-data">

        <label class="form-label">Item Name</label>

        <input
            type="text"
            name="title"
            class="form-control mb-3"
            placeholder="Example: Black Wallet"
            required
        >

        <label class="form-label">Description</label>

        <textarea
            name="description"
            class="form-control mb-3"
            rows="4"
            placeholder="Describe the item..."
            required
        ></textarea>

        <label class="form-label">Item Category</label>

        <select name="category" class="form-select mb-3" required>

            <option value="">Select Category</option>

            {% for c in categories %}
                <option value="{{ c }}">{{ c }}</option>
            {% endfor %}

        </select>

        <label class="form-label">Report Type</label>

        <select name="item_type" class="form-select mb-3" required>

            <option value="">Select Type</option>

            <option value="Lost">I Lost This Item</option>

            <option value="Found">I Found This Item</option>

        </select>

        <label class="form-label">Location</label>

        <input
            type="text"
            name="location"
            class="form-control mb-3"
            placeholder="Example: College Library"
            required
        >

        <label class="form-label">Upload Item Image</label>

        <input
            type="file"
            name="image"
            class="form-control mb-4"
            accept=".jpg,.jpeg,.png,.webp"
        >

        <button type="submit" class="btn btn-primary w-100">
            Submit Report
        </button>

    </form>

</div>

{% endblock %}
